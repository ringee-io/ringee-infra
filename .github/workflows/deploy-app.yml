name: Deploy app

# Builds ringee-app (public) at a ref and rolls it out to the environment of the
# branch this runs on: `staging` → the staging account, `main` → production,
# after the reviewer. Manual for now (Actions → Deploy app → Run workflow, "Use
# workflow from": staging or main), so staging can run before ringee-app has a
# deploy workflow on its own branches.
#
# Steps: ARM64 images built natively, pushed to ECR with the app's commit as an
# immutable tag; optional `prisma migrate deploy`; new task definition
# revisions; rollout; a check that no service was rolled back; smoke test.
# Role: github-deploy of the target account, through this repository's
# environment.

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: ringee-app branch, tag or full commit (empty = the branch this runs on)
        required: false
        default: ""
      migrate:
        description: Run prisma migrate deploy before the rollout
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-app-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  target:
    name: Pick environment and commit
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.pick.outputs.stack }}
      account: ${{ steps.pick.outputs.account }}
      environment: ${{ steps.pick.outputs.environment }}
      api_host: ${{ steps.pick.outputs.api_host }}
      app_sha: ${{ steps.pick.outputs.app_sha }}
    steps:
      - id: pick
        env:
          BRANCH: ${{ github.ref_name }}
          APP_REF: ${{ inputs.app_ref }}
        run: |
          # The smoke test goes through api2.ringee.io, which always reaches
          # AWS: api.ringee.io points at Railway until the cutover.
          case "$BRANCH" in
            main) stack=prod; account=405762675020; environment=production; api_host=api2.ringee.io ;;
            staging) stack=staging; account=699340623836; environment=staging; api_host=api.staging.ringee.io ;;
            *) echo "::error::Run this workflow from staging or main, not $BRANCH"; exit 1 ;;
          esac
          ref=${APP_REF:-$BRANCH}
          if [[ $ref =~ ^[0-9a-f]{40}$ ]]; then
            app_sha=$ref
          else
            app_sha=$(git ls-remote https://github.com/ringee-io/ringee-app "refs/heads/$ref" "refs/tags/$ref" | head -1 | cut -f1)
          fi
          if [[ -z $app_sha ]]; then
            echo "::error::ringee-app has no branch or tag named $ref"
            exit 1
          fi
          {
            echo "stack=$stack"
            echo "account=$account"
            echo "environment=$environment"
            echo "api_host=$api_host"
            echo "app_sha=$app_sha"
          } >> "$GITHUB_OUTPUT"
          echo "ringee-app $ref ($app_sha) → $environment" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.image }}
    needs: target
    # Native ARM64 (free for public repositories): Fargate runs Graviton.
    runs-on: ubuntu-24.04-arm
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: apps/backend/Dockerfile.compose
          - image: orchestrator
            dockerfile: apps/orchestrator/Dockerfile.compose
          - image: chatgpt-mcp
            dockerfile: apps/chatgpt-app/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ringee-io/ringee-app
          ref: ${{ needs.target.outputs.app_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.target.outputs.account }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: exists
        name: Skip if this commit is already in ECR
        env:
          REPOSITORY: ringee/${{ matrix.image }}
          TAG: ${{ needs.target.outputs.app_sha }}
        run: |
          # Tags are immutable: a re-run of the same commit reuses its image.
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/ringee/${{ matrix.image }}:${{ needs.target.outputs.app_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Roll out
    needs: [target, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      STACK: ${{ needs.target.outputs.stack }}
      CLUSTER: ringee-${{ needs.target.outputs.stack }}
      TAG: ${{ needs.target.outputs.app_sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.target.outputs.account }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: revisions
        name: Register task definitions with the new images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # Start from the family's latest revision, which carries whatever
          # Terraform last changed (variables, secrets, size), and swap the image.
          register() { # <task name> <repository>
            aws ecs describe-task-definition --task-definition "ringee-$STACK-$1" --query taskDefinition --output json |
              jq --arg image "$REGISTRY/$2:$TAG" '
                .containerDefinitions[0].image = $image
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' > task-definition.json
            aws ecs register-task-definition --cli-input-json file://task-definition.json \
              --query taskDefinition.taskDefinitionArn --output text
          }
          {
            echo "api=$(register api ringee/api)"
            echo "orchestrator=$(register orchestrator ringee/orchestrator)"
            echo "chatgpt=$(register chatgpt-mcp ringee/chatgpt-mcp)"
            echo "migrate=$(register migrate ringee/api)"
          } >> "$GITHUB_OUTPUT"

      - name: Migrate the database
        if: inputs.migrate
        env:
          TASK_DEFINITION: ${{ steps.revisions.outputs.migrate }}
        run: |
          subnets=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=ringee-$STACK-public-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          group=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=ringee-$STACK-ops" \
            --query 'SecurityGroups[0].GroupId' --output text)
          task=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEFINITION" --launch-type FARGATE \
            --started-by "deploy-app ${TAG::7}" \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$group],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query 'tasks[0].containers[0].exitCode' --output text)
          aws logs get-log-events --log-group-name "/ecs/ringee-$STACK-migrate" --log-stream-name "migrate/migrate/${task##*/}" \
            --query 'events[].message' --output text | tr '\t' '\n' || true
          if [[ $code != 0 ]]; then
            echo "::error::migrate exited with $code; the services were not updated"
            exit 1
          fi

      - name: Update the services
        env:
          API: ${{ steps.revisions.outputs.api }}
          ORCHESTRATOR: ${{ steps.revisions.outputs.orchestrator }}
          CHATGPT: ${{ steps.revisions.outputs.chatgpt }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service api --task-definition "$API" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service orchestrator --task-definition "$ORCHESTRATOR" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service chatgpt-mcp --task-definition "$CHATGPT" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services api orchestrator chatgpt-mcp
          # The circuit breaker may have rolled a service back to the previous
          # revision; "stable" alone would hide that.
          failed=0
          for pair in "api=$API" "orchestrator=$ORCHESTRATOR" "chatgpt-mcp=$CHATGPT"; do
            service=${pair%%=*}
            running=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].taskDefinition" --output text)
            if [[ $running != "${pair#*=}" ]]; then
              echo "::error::$service did not take the new revision (rolled back?)"
              failed=1
            fi
          done
          exit $failed

      - name: Smoke test
        env:
          API_HOST: ${{ needs.target.outputs.api_host }}
        run: |
          running=$(aws ecs describe-services --cluster "$CLUSTER" --services api --query 'services[0].runningCount' --output text)
          if [[ $running == 0 ]]; then
            echo "api has no running task (stack stopped or off hours); skipping the smoke test"
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "https://$API_HOST/api/health"
